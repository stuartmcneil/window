<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stuart McNeil</title>
<meta name="description" content="Projects, writing and work by Stuart McNeil.">
<meta name="theme-color" content="#0d1117">
<meta property="og:title" content="Stuart McNeil">
<meta property="og:description" content="Projects, writing and work.">
<meta property="og:image" content="desk.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🪟</text></svg>">
<style>
  :root{
    --ink:#f3f1ea;
    --panel:rgba(16,18,22,.86);
    --edge:rgba(255,255,255,.18);
    --accent:#ffd479;
    --shadow:0 24px 70px rgba(0,0,0,.55);
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#0b0d10;color:var(--ink);
    font:400 16px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  @media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms !important} }

  /* ---------- stage ----------
     The photograph sits smaller, inside a thick white mount, like a framed
     print on the wall. JS sizes the mount; every hotspot is measured from
     the photograph's own top-left corner, so the links follow it. */
  #stage{position:fixed;inset:0;overflow:hidden}
  #bg{
    position:absolute;inset:-6%;width:112%;height:112%;
    object-fit:cover;filter:blur(34px) brightness(.34) saturate(.8);transform:scale(1.06);
  }
  #mount{
    position:absolute;background:#fdfdfb;border-radius:3px;
    box-shadow:0 2px 4px rgba(0,0,0,.28), 0 26px 70px rgba(0,0,0,.55),
               0 0 0 1px rgba(0,0,0,.10);
    opacity:0;transform:scale(.985);
    transition:opacity 1s var(--ease),transform 1s var(--ease);
  }
  body.ready #mount{opacity:1;transform:none}
  #photo{position:absolute;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.13)}

  /* ---------- hotspots ----------
     The button itself is inert; the clipped .hit inside it is the object's
     actual silhouette and takes the pointer. Hovering .hit still triggers
     :hover on the button, which is what reveals the label. */
  #layer{position:absolute;inset:0}
  .spot{
    position:absolute;margin:0;padding:0;border:0;background:none;
    pointer-events:none;-webkit-tap-highlight-color:transparent;
  }
  .spot:focus{outline:none}
  .spot .hit{position:absolute;inset:0;pointer-events:auto;cursor:pointer}
  .spot .tag{
    position:absolute;left:50%;bottom:calc(100% + 12px);
    transform:translate(calc(-50% + var(--tx,0px)),6px);
    white-space:nowrap;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    padding:6px 12px;border-radius:999px;
    background:rgba(10,12,16,.9);border:1px solid var(--edge);color:var(--ink);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    opacity:0;pointer-events:none;
    transition:opacity .28s var(--ease),transform .28s var(--ease);
  }
  .spot.below .tag{bottom:auto;top:calc(100% + 12px);transform:translate(calc(-50% + var(--tx,0px)),-6px)}
  .spot:hover .tag,.spot:focus-visible .tag{opacity:1;transform:translate(calc(-50% + var(--tx,0px)),0)}

  /* ---------- panel ---------- */
  #scrim{
    position:fixed;inset:0;background:rgba(6,7,9,.62);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    opacity:0;pointer-events:none;transition:opacity .45s var(--ease);z-index:40;
  }
  body.open #scrim{opacity:1;pointer-events:auto}
  #panel{
    position:fixed;z-index:50;left:50%;top:50%;
    transform:translate(-50%,-46%) scale(.985);
    width:min(660px,calc(100vw - 2rem));max-height:min(78vh,760px);overflow:auto;
    background:var(--panel);border:1px solid var(--edge);border-radius:20px;
    box-shadow:var(--shadow);padding:2.1rem 2.2rem 2.3rem;
    opacity:0;pointer-events:none;
    transition:opacity .45s var(--ease),transform .45s var(--ease);
    overscroll-behavior:contain;
  }
  body.open #panel{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  #panel h2{margin:0 0 .2rem;font-size:1.6rem;font-weight:600;letter-spacing:-.01em}
  #panel .kicker{margin:0 0 1.3rem;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);opacity:.85}
  #panel p{margin:0 0 1rem;color:rgba(243,241,234,.86)}
  #panel ul{margin:0;padding:0;list-style:none;display:grid;gap:.7rem}
  #panel li a{
    display:block;padding:.85rem 1rem;border:1px solid var(--edge);border-radius:12px;
    color:var(--ink);text-decoration:none;
    transition:background .25s var(--ease),border-color .25s var(--ease),transform .25s var(--ease);
  }
  #panel li a:hover,#panel li a:focus-visible{background:rgba(255,212,121,.10);border-color:rgba(255,212,121,.5);transform:translateY(-1px)}
  #panel li a b{display:block;font-weight:600}
  #panel li a span{display:block;font-size:14px;color:rgba(243,241,234,.62);margin-top:.15rem}
  #close{
    position:absolute;top:.9rem;right:.9rem;width:36px;height:36px;border-radius:50%;
    border:1px solid var(--edge);background:rgba(255,255,255,.05);color:var(--ink);
    font-size:18px;line-height:1;cursor:pointer;
  }
  #close:hover{background:rgba(255,255,255,.12)}

  /* ---------- index fallback (touch / screen readers) ----------
     Set into the bottom-right corner of the photograph itself. JS puts it
     there; the shadow keeps it legible over the light wood beneath. */
  #menuBtn{
    position:absolute;z-index:30;
    padding:12px;margin:0;border:0;background:none;cursor:pointer;
    font-family:inherit;font-size:clamp(7px,.85vmin,9px);line-height:1;
    letter-spacing:.2em;text-transform:uppercase;
    color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.75), 0 0 10px rgba(0,0,0,.45);
    opacity:0;transition:opacity .8s var(--ease);
  }
  body.ready #menuBtn{opacity:.78}
  body.ready #menuBtn:hover,body.ready #menuBtn:focus-visible{opacity:1;outline:none}
  #menuBtn:focus-visible{text-decoration:underline}
  body.open #menuBtn{opacity:0;pointer-events:none}

  /* ---------- editor overlay (press E) ---------- */
  body.editing .spot .hit{background:rgba(255,212,121,.35);box-shadow:inset 0 0 0 1px rgba(255,212,121,.9)}
  body.editing .spot .tag{opacity:1;transform:translate(calc(-50% + var(--tx,0px)),0)}
  #readout{
    position:fixed;left:1rem;bottom:1rem;z-index:60;display:none;
    font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    background:rgba(8,9,12,.92);border:1px solid var(--edge);border-radius:10px;padding:.6rem .8rem;
    max-width:min(560px,90vw);white-space:pre-wrap;
  }
  body.editing #readout{display:block}

  /* ---------- WorkShy overlay (Media panel) ----------
     The 1999 fake copy dialog, embedded transparent over the photograph.
     Ctrl+Q inside it (or on the page) dismisses it. */
  #workshy{
    position:fixed;z-index:35;border:0;background:transparent;
    width:384px;height:163px;left:50%;top:50%;transform:translate(-50%,-50%);
    filter:drop-shadow(0 18px 40px rgba(0,0,0,.55));
  }
  body.open #workshy{pointer-events:none}
</style>
</head>
<body>

<div id="stage">
  <img id="bg" src="desk.jpg" alt="" aria-hidden="true">
  <div id="mount">
  <picture>
    <source srcset="desk.webp" type="image/webp">
    <img id="photo" src="desk.jpg" alt="A sunlit windowsill above Cardiff: framed photographs of the family, houseplants, a pen, a USB drive, a small painting of a sailing boat, a handmade wooden table and a canvas of a woman at a laptop. The objects on the sill are the links on this page.">
  </picture>
    <div id="layer"></div>
    <button id="menuBtn" aria-haspopup="dialog">Index</button>
  </div>
</div>

<div id="scrim"></div>
<div id="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle" tabindex="-1">
  <button id="close" aria-label="Close">×</button>
  <p class="kicker" id="pKicker"></p>
  <h2 id="pTitle"></h2>
  <div id="pBody"></div>
</div>

<div id="readout"></div>

<script>
/* =====================================================================
   HOTSPOTS

   Coordinates are PIXELS of the original photograph (1919 x 1081),
   so they can be read straight off the image in any editor.

     points : [[x,y], ...]  the object's outline — use this for anything
                            tilted, angled or irregular. The clickable area
                            is the polygon itself, not its bounding box.
     rect   : [x,y,w,h]     for genuinely rectangular targets.

   Set `target: null` to leave an object dormant (not hoverable, not clickable).
   `href` makes it an external link instead of opening a panel.
   Press E on the page to outline every shape and drag out new coordinates.
   ===================================================================== */
const SPOTS = [
  { id:'cv', object:'An interactive display of my career', label:'CV',
    href:'https://stuartmcneil.github.io/cv/',
    points:[[1600,345],[1919,296],[1919,702],[1527,628]] },

  { id:'making', object:'Handmade wooden table', label:'Making',
    points:[[1160,560],[1345,506],[1535,578],[1352,645]],
    kicker:'Off-screen work', title:'Making',
    body:`<p>Physical things, side builds and experiments that never make it into a repo.</p>` },

  { id:'view', object:'The window — Cardiff and the Channel', label:'The view',
    rect:[700,55,590,120],
    kicker:'Colophon', title:'The view',
    body:`<p>Cardiff, the bay and the Bristol Channel on a good day. The site is one
          photograph, one HTML file and no tracking. Source on GitHub.</p>` },

  { id:'media', object:'iPad on the desk', label:'Media',
    points:[[435,938],[725,967],[752,1000],[755,1081],[295,1081],[352,1002]],
    kicker:'Read and watched', title:'Media',
    body:`<ul>
      <li><a href="https://www.goodreads.com/review/list/91950832-stuart-mcneil?ref=nav_mybooks&shelf=read" target="_blank" rel="noopener"><b>Books</b><span>My shelf on Goodreads.</span></a></li>
      <li><a href="https://stuartmcneil.github.io/stuflix/"><b>Films</b><span>Stu Country for Old Men.</span></a></li>
      <li><a href="#workshy" data-workshy><b>Workshy app : copybar95</b><span>A 1999 Director gag, ported to JavaScript. Drag it about; Ctrl+Q to escape.</span></a></li>
    </ul>` },

  { id:'nate', object:'Nate as a baby', label:'Nate',
    href:'https://stuartmcneil.github.io/films/',
    points:[[0,185],[160,197],[158,393],[0,395]] },

  { id:'izzie', object:'Izzie', label:'Izzie',
    href:'https://stuartmcneil.github.io/izzies-coffee/',
    points:[[166,196],[293,203],[291,390],[164,388]] },

  { id:'family', object:'Small white frame', label:'Family',
    href:'https://stuartmcneil.github.io/family-tree/',
    points:[[335,390],[520,378],[516,556],[340,570]] },

  { id:'cars', object:'Red toy car', label:'Cars',
    points:[[140,387],[246,399],[246,458],[215,478],[180,481],[45,481],[8,448],[8,420]],
    kicker:'Four wheels', title:'Cars',
    body:`<ul>
      <li><a href="https://stuartmcneil.github.io/cars/"><b>Owners Workshop Manual</b><span>Every car I have owned, chapter by chapter.</span></a></li>
      <li><a href="https://stuartmcneil.github.io/F1"><b>F1 Fantasy HQ</b><span>Team, transfers and chip strategy.</span></a></li>
    </ul>` },

  { id:'writing', object:'Pen and stylus on the sill', label:'Writing',
    href:'https://www.overleaf.com/',
    points:[[475,558],[715,608],[715,642],[475,592]] },

  { id:'music', object:'Upright headphone jack', label:'Music',
    points:[[227,436],[243,436],[249,502],[219,502]],
    kicker:'What is playing', title:'Music',
    body:`<ul>
      <li><a href="https://www.discogs.com/user/stuartmcneil/collection" target="_blank" rel="noopener"><b>Discogs</b><span>My record collection.</span></a></li>
      <li><a href="https://open.spotify.com/playlist/1mefKk4ZWyoGoSyIB8x7DB?si=15_-E9hXRdC9LGcHEr5RSA" target="_blank" rel="noopener"><b>Spotify</b><span>Current playlist.</span></a></li>
      <li><a href="https://stuartmcneil.github.io/Stux-on-Wax/"><b>Stux on Wax</b><span>Records, written up.</span></a></li>
    </ul>` },

  { id:'github', object:'USB drive on the sill', label:'GitHub',
    href:'https://github.com/stuartmcneil',
    points:[[851,637],[880,640],[878,684],[848,682]] },

  /* --- dormant objects, catalogued and ready. Give one a label and a body to wake it. --- */
  { id:'plant',    object:'Pilea plant in its ribbed pot', target:null,
    points:[[1035,212],[1140,235],[1185,320],[1155,410],[1300,455],[1365,545],[1300,600],
            [1150,600],[1150,642],[985,642],[985,530],[870,480],[862,368],[960,300],[985,240]] },
  { id:'tin',      object:'Playing-card tin', target:null,
    points:[[925,606],[1065,638],[1092,688],[1040,722],[908,704],[886,660]] },
  { id:'sailboat', object:'Framed painting — sailing boat', target:null, rect:[555,395,350,230] },
  { id:'bicycle',  object:'Bicycle print card',             target:null, rect:[250,315,180,190] },
  { id:'jade',     object:'Jade plant',                     target:null, rect:[300,190,190,200] },
  { id:'cactus',   object:'Flowering cactus',               target:null, rect:[565,155,325,255] },
  { id:'coaster',  object:'Carved coaster',                 target:null, rect:[1160,700,175,80] },
  { id:'trivet',   object:'Cork trivet',                    target:null, rect:[0,645,190,135]  }
];

const NAT_W = 1919, NAT_H = 1081;

/* every spot gets a polygon in photo pixels, plus its bounding box */
SPOTS.forEach(s => {
  const pts = s.points || (([x,y,w,h]) => [[x,y],[x+w,y],[x+w,y+h],[x,y+h]])(s.rect);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  s.pts = pts;
  s.bx = Math.min(...xs); s.by = Math.min(...ys);
  s.bw = Math.max(...xs) - s.bx; s.bh = Math.max(...ys) - s.by;
});

/* same-site links stay in this tab; anything off-site opens a new one */
function go(href){
  let sameSite = false;
  try { sameSite = new URL(href, location.href).origin === location.origin; } catch (e) {}
  if (sameSite) location.href = href; else window.open(href, '_blank', 'noopener');
}

/* ---------------- build ---------------- */
const layer = document.getElementById('layer');
const mount = document.getElementById('mount');
const menuBtn = document.getElementById('menuBtn');
const photo = document.getElementById('photo');
const live  = SPOTS.filter(s => s.target !== null);

live.forEach(s => {
  const b = document.createElement('button');
  b.className = 'spot';
  b.dataset.id = s.id;
  const name = s.label || s.object;
  b.setAttribute('aria-label', name.toLowerCase() === s.object.toLowerCase() ? name : name + ' — ' + s.object);
  b.innerHTML = `<span class="hit"></span><span class="tag">${s.label || s.object}</span>`;
  b.addEventListener('click', () => s.href ? go(s.href) : openPanel(s.id));
  // the silhouette, as percentages of the button's own box
  b.querySelector('.hit').style.clipPath = 'polygon(' + s.pts.map(([x,y]) =>
    `${((x - s.bx) / s.bw * 100).toFixed(2)}% ${((y - s.by) / s.bh * 100).toFixed(2)}%`
  ).join(',') + ')';
  layer.appendChild(b);
  s.el = b;
});

/* ------------- fit + position ------------- */
const clamp = (lo, v, hi) => Math.round(Math.max(lo, Math.min(hi, v)));

function fit(){
  const cw = innerWidth, ch = innerHeight, min = Math.min(cw, ch);
  const gap    = clamp(10, min * 0.035, 56);   // dark ground around the mount
  const border = clamp(16, min * 0.048, 62);   // the white mount itself

  const scale = Math.min((cw - 2*gap - 2*border) / NAT_W,
                         (ch - 2*gap - 2*border) / NAT_H);
  const dw = NAT_W * scale, dh = NAT_H * scale;
  const mx = (cw - dw - 2*border) / 2, my = (ch - dh - 2*border) / 2;

  // ox / oy are the photograph's top-left corner in page coordinates
  return { scale, dw, dh, border, mx, my, ox: mx + border, oy: my + border };
}

function place(){
  const { scale, dw, dh, border, mx, my, ox, oy } = fit();

  mount.style.left   = mx + 'px';
  mount.style.top    = my + 'px';
  mount.style.width  = (dw + 2 * border) + 'px';
  mount.style.height = (dh + 2 * border) + 'px';

  // the index tucks into the photograph's bottom-right corner
  const inset = Math.max(6, Math.round(dw * 0.008));
  const pad = 12;                                    // padding, for a decent tap target
  menuBtn.style.right  = (border + inset - pad) + 'px';
  menuBtn.style.bottom = (border + inset - pad) + 'px';

  photo.style.left   = border + 'px';
  photo.style.top    = border + 'px';
  photo.style.width  = dw + 'px';
  photo.style.height = dh + 'px';

  // touch devices get a 44px minimum target; the silhouette scales with the box
  const MIN = matchMedia('(pointer:coarse)').matches ? 44 : 0;

  live.forEach(s => {
    let x = border + s.bx * scale, y = border + s.by * scale;
    let w = s.bw * scale,      h = s.bh * scale;
    if (w < MIN) { x -= (MIN - w) / 2; w = MIN; }
    if (h < MIN) { y -= (MIN - h) / 2; h = MIN; }
    s.el.style.left = x + 'px'; s.el.style.top = y + 'px';
    s.el.style.width = w + 'px'; s.el.style.height = h + 'px';

    // keep the label on screen: flip it below if it would clip the top,
    // nudge it sideways at the edges
    s.el.classList.toggle('below', my + y < 46);
    const centre = mx + x + w / 2, pad = 86;
    const shift = centre < pad ? pad - centre
                : centre > innerWidth - pad ? innerWidth - pad - centre : 0;
    s.el.style.setProperty('--tx', shift.toFixed(0) + 'px');
  });
}
addEventListener('resize', place);
addEventListener('orientationchange', () => setTimeout(place, 120));
place();

if (photo.complete) ready(); else photo.addEventListener('load', ready);
function ready(){ place(); document.body.classList.add('ready'); }

/* ------------- panel ------------- */
const panel = document.getElementById('panel');
let lastFocus = null;

function openPanel(id){
  const s = SPOTS.find(v => v.id === id); if (!s) return;
  lastFocus = document.activeElement;
  document.getElementById('pKicker').textContent = s.kicker || '';
  document.getElementById('pTitle').textContent  = s.title || s.label || s.object;
  document.getElementById('pBody').innerHTML     = s.body || '';
  document.body.classList.add('open');
  history.replaceState(null, '', '#' + id);
  bindJumps();
  panel.focus();
}
function bindJumps(){
  panel.querySelectorAll('[data-jump]').forEach(a =>
    a.addEventListener('click', ev => { ev.preventDefault(); openPanel(a.dataset.jump); }));
  panel.querySelectorAll('[data-workshy]').forEach(a =>
    a.addEventListener('click', ev => { ev.preventDefault(); closePanel(); openWorkshy(); }));
}

/* ------------- WorkShy overlay ------------- */
let workshy = null;
function openWorkshy(){
  if (workshy) { workshy.contentWindow.focus(); return; }
  workshy = document.createElement('iframe');
  workshy.id = 'workshy';
  workshy.src = 'workshy/';
  workshy.title = 'WorkShy — press Ctrl+Q to close';
  workshy.setAttribute('allowtransparency', 'true');
  workshy.addEventListener('load', () => workshy && workshy.contentWindow.focus());
  document.getElementById('stage').appendChild(workshy);
  history.replaceState(null, '', '#workshy');
}
function closeWorkshy(){
  if (!workshy) return;
  workshy.remove(); workshy = null;
  if (location.hash === '#workshy') history.replaceState(null, '', location.pathname);
}
/* the iframe tells us when its own Ctrl+Q has finished, and asks us to move
   it when its title bar is dragged */
addEventListener('message', e => {
  if (e.origin !== location.origin) return;
  if (e.data === 'workshy:quit') { closeWorkshy(); return; }
  if (workshy && e.data && e.data.type === 'workshy:move') {
    if (workshy.style.transform !== 'none') {
      // first drag: swap the centred placement for explicit pixels
      const r = workshy.getBoundingClientRect();
      workshy.style.transform = 'none';
      workshy.style.left = r.left + 'px';
      workshy.style.top  = r.top + 'px';
    }
    const x = parseFloat(workshy.style.left) + e.data.dx;
    const y = parseFloat(workshy.style.top)  + e.data.dy;
    // keep at least the title bar on screen
    workshy.style.left = Math.max(40 - 384, Math.min(innerWidth - 40, x)) + 'px';
    workshy.style.top  = Math.max(0, Math.min(innerHeight - 20, y)) + 'px';
  }
});
function closePanel(){
  document.body.classList.remove('open');
  history.replaceState(null, '', location.pathname);
  if (lastFocus) lastFocus.focus();
}
document.getElementById('close').addEventListener('click', closePanel);
document.getElementById('scrim').addEventListener('click', closePanel);
addEventListener('keydown', e => {
  // Ctrl+Q while WorkShy is up but the page has focus: pass it through to the dialog
  if (workshy && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'q') {
    e.preventDefault(); workshy.contentWindow.postMessage('workshy:quit', location.origin); return;
  }
  if (e.key === 'Escape' && document.body.classList.contains('open')) closePanel();
  if (e.key.toLowerCase() === 'e' && !document.body.classList.contains('open')) document.body.classList.toggle('editing');
});

/* index fallback menu */
menuBtn.addEventListener('click', () => {
  document.getElementById('pKicker').textContent = 'Everything on the sill';
  document.getElementById('pTitle').textContent  = 'Index';
  document.getElementById('pBody').innerHTML =
    '<ul>' + live.map(s =>
      `<li><a href="${s.href || '#' + s.id}"${s.href ? ' rel="noopener"' : ` data-jump="${s.id}"`}><b>${s.label || s.object}</b>${(s.label || '').toLowerCase() === s.object.toLowerCase() ? '' : `<span>${s.object}</span>`}</a></li>`
    ).join('') + '</ul>';
  document.body.classList.add('open');
  bindJumps();
  panel.focus();
});

/* deep links: site.com/#projects */
if (location.hash === '#workshy') {
  openWorkshy();
} else if (location.hash) {
  const s = SPOTS.find(v => v.id === location.hash.slice(1));
  if (s && s.href) go(s.href); else if (s) openPanel(s.id);
}

/* ------------- editor: press E, then drag a box ------------- */
const readout = document.getElementById('readout');
let drag = null;
document.getElementById('stage').addEventListener('pointerdown', e => {
  if (!document.body.classList.contains('editing')) return;
  e.preventDefault();
  drag = { x:e.clientX, y:e.clientY };
});
addEventListener('pointerup', e => {
  if (!drag) return;
  const { scale, ox, oy } = fit();
  const px = X => Math.round((X - ox) / scale), py = Y => Math.round((Y - oy) / scale);
  const x1 = px(Math.min(drag.x, e.clientX)), x2 = px(Math.max(drag.x, e.clientX));
  const y1 = py(Math.min(drag.y, e.clientY)), y2 = py(Math.max(drag.y, e.clientY));
  readout.textContent =
    `rect:[${x1},${y1},${x2-x1},${y2-y1}]\n` +
    `points:[[${x1},${y1}],[${x2},${y1}],[${x2},${y2}],[${x1},${y2}]]\n` +
    `(photo pixels — drag again, or press E to exit)`;
  drag = null;
});
</script>
</body>
