<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WorkShy</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* The original stage was white; here everything outside the dialog artwork is
     transparent so the page can sit on top of stuartmcneil.github.io/window/ */
  html, body { margin: 0; height: 100%; background: transparent; }
  body { display: flex; align-items: center; justify-content: center; }
  #stage {
    position: relative;
    width: 384px; height: 163px;
    overflow: hidden;
    background: transparent;
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
    outline: none;
    image-rendering: pixelated;
  }
  #stage > * { position: absolute; }
  #bk    { left: -2px; top: -1px; width: 385px; height: 163px; }   /* sprite 1: "pc bar bk", stretched 385x163 */

  /* Progress trough: blocks fill from the left, one at a time */
  #bar   { left: 16px; top: 126px; width: 282px; height: 8px; }
  #bar > i {
    position: absolute; top: 0; height: 8px; width: 8px;
    background: #000080;                                            /* member 2's navy */
    visibility: hidden;
  }
  #bar > i.on { visibility: visible; }

  /* Status line (member 4: field "txt") */
  #txt   {
    left: 40px; top: 100px; width: 263px; height: 14px;
    font: 12px/14px "Courier New", Courier, monospace;
    color: #000; white-space: nowrap; overflow: hidden;
  }

  /* One sheet of paper at a time hops from the left folder to the right one,
     moved by JS in discrete steps (6 frames a second) for that stepped, 16-colour
     copy-dialog feel. The sheet is drawn here from scratch: white page, dark
     outline, folded top-right corner, a few grey lines of "text". */
  #papers { left: 0; top: 0; width: 384px; height: 100px; pointer-events: none; }
  .paper {
    position: absolute; left: 0; top: 0;
    width: 22px; height: 28px;
    background:
      /* text lines */
      repeating-linear-gradient(to bottom, transparent 0 3px, #808080 3px 4px, transparent 4px 6px) 3px 9px / 14px 15px no-repeat,
      /* the page itself */
      #fff;
    clip-path: polygon(0 0, 15px 0, 22px 7px, 22px 28px, 0 28px);
    box-shadow: inset 0 0 0 1px #000;
    transform-origin: 50% 50%;
    will-change: transform;
  }
  .paper::after {              /* the folded corner */
    content: ""; position: absolute; right: 0; top: 0;
    width: 7px; height: 7px;
    background: #c0c0c0;
    clip-path: polygon(0 0, 0 100%, 100% 100%);
    box-shadow: inset 0 0 0 1px #000;
  }
  .paper.back {                /* the reverse of the sheet, seen mid-flip: plain, no fold */
    background: #e8e8e8;
    clip-path: none;
  }
  .paper.back::after { display: none; }

  /* the blue strip is a drag handle */
  #stage.dragging { cursor: move; }

  /* Member 6: rich text, pre-rendered in Director */
  #tea   { left: 11px; top: 80px; }

  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div id="stage" tabindex="0" aria-label="Copying… press Ctrl+Q to close">
    <img id="bk"  src="pc_bar_bk.png" alt="" draggable="false">
    <div id="papers"></div>
    <div id="bar"></div>
    <div id="txt"></div>
    <img id="tea" src="tea_text.png" alt="Did you have a nice cup of tea? inabit..stuart" draggable="false" hidden>
  </div>
  <script src="workshy.js"></script>
</body>
</html>
